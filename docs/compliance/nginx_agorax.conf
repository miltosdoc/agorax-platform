# Production nginx site for agoraxdemocracy.com, as deployed in
# /etc/nginx/sites-available/agorax (copied 2026-10-29). After editing:
# nginx -t && systemctl reload nginx

server {
    server_name agoraxdemocracy.com www.agoraxdemocracy.com _;

    client_max_body_size 100M;

    # Public Android domain association; no application/account data.
    location = /.well-known/assetlinks.json {
        alias /opt/agorax/client/public/.well-known/assetlinks.json;
        types { }
        default_type application/json;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options nosniff always;
    }

    # Voting requests are never logged, in the access log or the error log.
    # /blind-sign is authenticated and /anonymous-vote carries the ballot;
    # their IPs and times together would link a member to a choice. The
    # receipt lookups carry the token or row hash, which identifies the ballot.
    # The polling panel works the same way: /api/panel/enroll/sign is
    # authenticated, registration and survey answers are anonymous.
    location ~ ^/api/(proposals/[0-9]+/(blind-key|blind-sign|anonymous-vote|verify-receipt|receipt-inclusion)|panel/(enroll/key|enroll/sign|register|me|profile)|surveys/[0-9]+/(instrument|respond))$ {
        access_log off;
        error_log /dev/null emerg;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/agoraxdemocracy.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/agoraxdemocracy.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.agoraxdemocracy.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = agoraxdemocracy.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80 default_server;
    listen [::]:80 default_server;
    server_name agoraxdemocracy.com www.agoraxdemocracy.com _;
    return 404; # managed by Certbot




}