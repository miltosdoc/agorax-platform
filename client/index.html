<!DOCTYPE html>
<html lang="el">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>AgoraX - Πλατφόρμα Ψηφιακής Δημοκρατίας</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- AgoraX type system: GFS Didot (display, Greek state serif) ·
         Inter (UI, tabular numerals) · IBM Plex Mono (hashes/counts/time). -->
    <link href="https://fonts.googleapis.com/css2?family=GFS+Didot&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Roboto+Condensed:wght@700;800&family=Fira+Sans:wght@800;900&display=swap" rel="stylesheet">
    <!-- Logo icons: drawn by scripts/render-brand-assets.mjs -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    
    <!-- Social Media Sharing - Dynamic tags loaded per page -->
    <meta property="og:title" content="AgoraX - Πλατφόρμα Ψηφιακής Δημοκρατίας" />
    <meta property="og:description" content="Ψηφιακή πλατφόρμα για μια πιο ανοιχτή και συμμετοχική διακυβέρνηση." />
    <meta property="og:type" content="website" />
    
    <!-- Twitter/X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AgoraX - Πλατφόρμα Ψηφιακής Δημοκρατίας" />
    <meta name="twitter:description" content="Ψηφιακή πλατφόρμα για μια πιο ανοιχτή και συμμετοχική διακυβέρνηση." />
    
    <meta name="description" content="AgoraX - Πλατφόρμα Ψηφιακής Δημοκρατίας για μια πιο ανοιχτή και συμμετοχική διακυβέρνηση." />

    <!-- Colour theme, applied before first paint so the page never flashes
         navy for a member who chose another accent. Mirrors use-theme.ts. -->
    <script>
      try {
        var agoraTheme = localStorage.getItem('agorax-theme');
        // The landing page comes in navy or spray only (shared/theme.ts):
        // another chosen theme shows as navy there, and a visitor who never
        // chose is dealt one of the two at random, kept for later visits.
        if (location.pathname === '/' && agoraTheme !== 'navy' && agoraTheme !== 'spray') {
          if (agoraTheme) {
            agoraTheme = 'navy';
          } else {
            agoraTheme = localStorage.getItem('agorax-landing-look');
            if (agoraTheme !== 'navy' && agoraTheme !== 'spray') {
              agoraTheme = Math.random() < 0.5 ? 'navy' : 'spray';
              localStorage.setItem('agorax-landing-look', agoraTheme);
            }
          }
        }
        if (agoraTheme && agoraTheme !== 'navy' && /^[a-z]{1,16}$/.test(agoraTheme)) {
          document.documentElement.setAttribute('data-accent', agoraTheme);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
